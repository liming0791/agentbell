name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run ci

  compatibility:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Use Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Go tests
        working-directory: core
        run: go test ./...

      - name: Verify durable emit p95
        if: matrix.node == 22
        run: npm run perf:emit

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.mod

      - name: Run race detector
        working-directory: core
        run: go test -race ./...

  cross-build:
    name: Six-target Core build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Use Go 1.26.5
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: core/go.mod

      - name: Build all release targets
        run: npm run build:core
